[project]
name = "cvforge"
version = "0.1.0"
description = "Deterministic, ATS-safe resume formatter"
readme = "README.md"
authors = [
    { name = "RahimMahat", email = "rahimmahat99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.7",
    "pylatexenc>=2.11",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.6",
    "rich>=13",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "typst>=0.15.0",
]

[project.optional-dependencies]
llm = ["anthropic"]
tui = ["textual"]

[project.scripts]
cvforge = "cvforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
 "ruff>=0.6",
 "textual>=8.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Root-level resources ship inside the wheel; see cvforge.config.resource().
[tool.hatch.build.targets.wheel.force-include]
"cvforge.toml.example" = "cvforge/_data/cvforge.toml.example"
"examples" = "cvforge/_data/examples"
"keywords.txt" = "cvforge/_data/keywords.txt"
"themes" = "cvforge/_data/themes"
"fonts" = "cvforge/_data/fonts"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
